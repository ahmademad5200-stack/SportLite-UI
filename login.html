<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div class="min-h-screen bg-[#121212]  flex flex-col text-white items-center ">
    <div class="flex items-center justify-center max-auto  max-w-[732px] h-[40px] w-full mb-12 mt-10 ">

      <div class="flex-grow h-[2px] bg-gradient-to-l from-orange-600 to-orange-500 "></div>
      <h1 class="p-12 text-xl md:text-2xl font-bold text-white  ">تسجيل الدخول</h1>
      <div class="flex-grow h-[2px] bg-gradient-to-l from-orange-600 to-orange-500  "></div>
    </div>

    <div class="w-full max-w-6xl flex flex-col lg:flex-row items-center justify-around gap-14">

      <div class="w-full max-w-md bg-[#121212] p-6 m-8">
        <form class="space-y-6">

          <div>
            <label class="block text-sm mb-2 mr-1">رقم الهاتف أو البريد الإلكتروني</label>
            <input type="email" placeholder="Ahmad@gmail.com"
              class="w-full min- h-53 bg-[#2C2C2C] border border-[#2C2C2C] rounded-lg p-3 text-right hover:border-[#FF9500] text-right transition outline-none">
          </div>

          <div class="relative">
            <label class="block text-sm mb-2 mr-1">كلمة المرور</label>
            <input type="password"
              class="w-full min- h-53 bg-[#2C2C2C] border border-[#2C2C2C] rounded-lg p-3 text-right focus:border-orange-500 outline-none transition">
            <a href="#" class="absolute left-3 top-11 text-zinc-500 cursor-pointer"><i class="fa-solid fa-eye"></i></a>
          </div>

          <div class="text-right ">
            <a href="#" class="text-xs text-blue-500 hover:underline">هل نسيت كلمة المرور؟</a>
          </div>
        </form>
<div class="flex  items-center justify-center p-6 ">
        <button type="submit" class="bg-[#DA6425] w-60 text-[#fff] p-3 rounder-full rounded-full min-w-700 border-1   py-3  transition-all 
           transform hover:scale-105  ">تسجيل الدخول</button></div>
           
        <p class="text-center text-sm text-[#fff] mt-4 h hover:underline hover:text-[#D56D34] "> ليس لديك حساب ؟<span class="text-[#2C2C2C]">
            إنشاء حساب</span></p>
      </div>
      <div class="relative ">
        <div class=" w-[480px] h-[480px] md:w-80 md:h-80 rounded-full border-35 border-[#FF9500] shadow-4xl  overflow-hidden">
          <img src="images/trainer-portrait-smiling.jpg" alt="" class="w-full h-full object:cover">
        </div>
        <div
          class=" absolute -top-0 -right-0  text-[#DA6425] m-3  p-3 w-35 h-15 rounded-l-xl rounded border border-[#D56D34] ">
          <button>اخسر سعرات<p>-1500</p></button>
        </div>
        <div
          class="absolute -top-0 -left-0 text-[#DA6425] m-3  p-3 w-35 h-15 rounded-l-xl rounded border border-[#D56D34]">
          <button class="">اكسب <p class="">+2kg</p></button>
        </div>
        <div
          class="absolute -bottom-0 -right-8  m-3 text-[#DA6425]  p-3 w-35 h-15 rounded-l-xl rounded border border-[#D56D34] ">
          <button class="">اكسب <p class="">+2kg</p></button>
        </div>
        <div
          class=" absolute -bottom-0 -left-2  text-[#DA6425] m-3  p-3 w-35 h-15 rounded-l-xl rounded border border-[#D56D34]">
          <button class="">اخسر<p class="">-8kg</p></button>
        </div>
      </div>
    </div>
  </div>
  <script src="scripts/api/auth-api.js"></script>
  <script src="scripts/ui/login.js"></script>
</body>

</html>
