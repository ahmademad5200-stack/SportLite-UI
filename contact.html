<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="flex   items-center justify-between w-full min-h[80] bg-[#2C2C2C] px-4 md:px-10 mt-10]">
        <div class="flex items-center gap-2 ">
            <button type="submit"
                class="text-[#fff] bg-[#DA6425] p-3 rounded-full border border-[#FF9500] w-28 hover:bg-[#FF9500] ">اشتراك</button>
            <button type="submit"
                class="text-[#FF9500] border border-[#FF9500] bg-[#121212] rounded-full p-3 m-4 text-sm">تسجيل
                الدخول</button>
        </div>
        <div class="text-[#fff] items-center gap-6 hidden md:flex ">
            <a class="hover:text-[#FF9500]">الرئيسيه</a>
            <a class="hover:text-[#FF9500]">البرامج</a>
            <a class="hover:text-[#FF9500]">المدربين</a>
            <a class="hover:text-[#FF9500]">الاجهزه</a>
            <a class="hover:text-[#FF9500]">الاخبار</a>
            <a class="hover:text-[#FF9500]">تواصل معنا <div class="w-20 h-1 bg-[#DA6425] rounded-sm"></div></a>

        </div>
        <div class="flex flex-col items-end gap-2 order-1 md:order-3">
            <div class="flex items-center gap-3">
                <div class="text-right">
                    <a href="#" class="text-[#fff] font-bold text-lg md:text-xl">Sport <span
                            class="text-[#FF9500]">Lite</span></a>
                </div>
                <div class="w-8 h-8 md:w-10 md:h-10 bg-[#DA6425] rounded-sm"></div>
            </div>

            <p class="text-end text-[#fff]  md:text-sm opacity-80">Transform Your Body</p>
        </div>
    </div>

    <div class="min-h-screen bg-[#121212] flex flex-col text-white items-center pb-20">
    <div class="flex items-center justify-center max-w-[732px] h-[40px] w-full mb-12 mt-10 px-4">
        <div class="flex-grow h-[2px] bg-gradient-to-l from-orange-600 to-orange-500"></div>
        <h1 class="px-8 text-xl md:text-2xl font-bold text-white whitespace-nowrap">تواصل معنا</h1>
        <div class="flex-grow h-[2px] bg-gradient-to-l from-orange-600 to-orange-500"></div>
    </div>

    <div class="flex flex-col md:flex-row gap-10 w-full max-w-6xl px-6 items-start justify-center">
        
        <div class="w-full md:w-1/2 bg-transparent">
            <form class="space-y-6">
                <div>
                    <label class="block text-sm mb-2 mr-1 text-right">الاسم الكامل</label>
                    <input type="text" placeholder="ادخل اسمك هنا"
                        class="w-full bg-[#2C2C2C] border border-transparent rounded-lg p-3 text-right hover:border-[#FF9500] transition outline-none">
                </div>
                <div>
                    <label class="block text-sm mb-2 mr-1 text-right">البريد الإلكتروني</label>
                    <input type="email" placeholder="example@domain.com"
                        class="w-full bg-[#2C2C2C] border border-transparent rounded-lg p-3 text-right hover:border-[#FF9500] transition outline-none">
                </div>
                <div>
                    <label class="block text-sm mb-2 mr-1 text-right">رقم الهاتف</label>
                    <input type="text" placeholder="(+963) 0933333333"
                        class="w-full bg-[#2C2C2C] border border-transparent rounded-lg p-3 text-right hover:border-[#FF9500] transition outline-none">
                </div>
                <div>
                    <label for="notes" class="block text-sm mb-2 mr-1 text-right">الموضوع</label>
                    <textarea name="notes" id="notes" rows="5"
                        class="w-full bg-[#2C2C2C] border border-transparent rounded-lg p-3 text-right hover:border-[#FF9500] transition outline-none"></textarea>
                </div>
                <button type="submit" class="bg-[#DA6425] text-white p-3 rounded-full w-full font-bold hover:scale-105 transition-transform mt-4">
                    إرسال
                </button>
            </form>
        </div>

        <div class="w-500 md:w-1/3 flex flex-col items-center">
            
            <div class="bg-[#2C2C2C] p-8 rounded-xl w-full m-6 p-0" >
                <h2 class="text-xl text-[#D56D34] font-bold mb-6 border-b border-gray-700 pb-2 text-right">معلومات التواصل</h2>
                <ul class="space-y-6">
                    <li class="flex items-center gap-4">
                        <i class="fa-solid fa-location-dot text-[#D56D34] w-6 text-center text-lg"></i>
                        <span class="text-white">سوريا، حلب، المحافظة</span>
                    </li>
                    <li class="flex items-center gap-4">
                        <i class="fa-solid fa-phone text-[#D56D34] w-6 text-center text-lg"></i>
                        <span class="text-white" dir="ltr">0963 933333333</span>
                    </li>
                    <li class="flex items-center gap-4">
                        <i class="fa-solid fa-envelope text-[#D56D34] w-6 text-center text-lg"></i>
                        <span class="text-white">SportsLite@gmail.com</span>
                    </li>
                    <li class="flex items-center gap-4">
                        <i class="fa-solid fa-clock text-[#D56D34] w-6 text-center text-lg"></i>
                        <span class="text-white">من 8 صباحاً حتى 6 مساءً</span>
                    </li>
                </ul>
            </div>
            <div class="flex items-center justify-center gap-6 mt-8">
                <a href="#" class="text-[#FF9500] text-2xl hover:scale-110 transition"><i class="fa-brands fa-youtube "></i></a>
                <a href="#" class="text-[#FF9500] text-2xl hover:scale-110 transition"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="text-[#FF9500] text-2xl hover:scale-110 transition"><i class="fa-brands fa-x-twitter"></i></a>
               <a href="#" class="text-[#FF9500] text-2xl hover:scale-110 transition rounded-sm"><i class="fa-brands fa-square-facebook"></i></a>
            </div>
        </div>
    </div>
</div>
    <div class="">
 <div class="  w-full h-[600px] bg-cover bg-center bg-[url('')] flex flex-row items-center justify-center"></div>
<img src="images/" alt="">
    </div>
</body>
<script src="scripts/api/messages-api.js"></script>
<script src="scripts/ui/contact.js"></script>
</body>

</html>
